<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3> Student Registration Form</h3>
    <form action="" method="post">
        <label>FIRST NAME</label> &nbsp;
        <input type="text" name="fname" maxlength="30" placeholder="First Name" autofocus required> <br> <br>

        <label>LAST NAME</label> &nbsp;
        <input type="text" name="lname" maxlength="30" placeholder="Last Name" autofocus required> <br> <br>

        <label>DATE OF BIRTH </label> &nbsp;
        <select name="month">
            <option selected>Month</option>
            <option value="january">January</option>
            <option value="february">February</option>
            <option value="march">March</option>
            <option value="april">April</option>
            <option value="may">May</option>
            <option value="june">June</option>
            <option value="july">July</option>
            <option value="august">August</option>
            <option value="september">September</option>
            <option value="october">October</option>
            <option value="november">November</option>
            <option value="December">December</option>
        </select>
        
        <select name="day">
            <option selected>Day</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
            <option value="17">17</option>
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20</option>
            <option value="21">21</option>
            <option value="22">22</option>
            <option value="23">23</option>
            <option value="24">24</option>
            <option value="25">25</option>
            <option value="26">26</option>
            <option value="27">27</option>
            <option value="28">28</option>
            <option value="29">29</option>
            <option value="30">30</option>
            <option value="31">31</option>
        </select>
        
        <select name="year"> 
            <option selected>Year</option>
            <option value="2000">2000</option>
            <option value ="2001">2001</option>
        </select> <br> <br>

        <label>EMAIL ID</label> &nbsp;
        <input type="text" name="email" required> <br> <br>

        <label>MOBILE NUMBER</label> &nbsp;
        <input type="text" name="number" maxlength="10" required> <br> <br>

        <label>GENDER</label> &nbsp;
        <input type="radio" value="male" checked> <label>Male</label> &nbsp;
        <input type="radio" value="female"> <label>Female</label> <br> <br>

        <label>MUNICIPALITY</label> &nbsp;
        <select>
            <option selected>Select Municipality</option>
            <option value="Baay-Licuan">Baay-Licuan</option>
            <option value="Bangued">Bangued</option>  
            <option value="Boliney">Boliney</option>
            <option value="Bucay">Bucay</option>
            <option value="Bucloc">Bucloc</option>
            <option value="Daguioman">Daguioman</option>
            <option value="Danglas">Danglas</option>
            <option value="Dolores">Dolores</option>
            <option value="La Paz">La Paz</option>
            <option value="Lacub">Lacub</option>
            <option value="Lagangilang">Lagangilang</option>
            <option value="Lagayan">Lagayan</option>
            <option value="Langiden">Langiden</option>
            <option value="Luba">Luba</option>
            <option value="Malibcong">Malibcong</option>
            <option value="Manabo">Manabo</option>
            <option value="Peñarrubia">Peñarrubia</option>
            <option value="Pidigan">Pidigan</option>
            <option value="Pilar">Pilar</option>
            <option value="Sallapadan">Sallapadan</option>
            <option value="San Isidro">San Isidro</option>
            <option value="Tayum">Tayum</option>
            <option valu="Tineg">Tineg</option>
            <option value="Tubo">Tubo</option>
            <option value="Villaviciosa">Villaviciosa</option>
        </select> <br> <br>

        <label>PIN CODE</label>
        <input type="text" name="pin" maxlength="6" required> <br> <br>

        <label>COUNTRY</label>
        <input type="text" name="country" required> <br> <br>
        
        <label>HOBBIES</label>
        <input type="checkbox" name="Drawing"> <label>Drawing</label> &nbsp;
        <input type="checkbox" name="Dancing"> <label>Dancing</label> &nbsp;
        <input type="checkbox" name="Sketching"> <label>Sketching</label> <br> <br>
        <input type="checkbox" name="Others"> <label>Others</label> &nbsp;
        <input type="text" name="specify"> <br> <br>

        <label>COURSES</label>
        <input type="radio" value="BSCS" checked> <label>BSCS</label> &nbsp;
        <input type="radio" value="BSIT"> <label>BSIT</label> <br> <br>

        <button type="submit" name="submit">Submit</button>
        <button type="reset" name="reset">Reset</button>
        
    </form>
</body>
</html>
